name = "winter-realms"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# Pays autorisés à se connecter (codes ISO séparés par des virgules ; vide = tout le monde).
# En local, server/.dev.vars remplace cette valeur.
[vars]
ALLOWED_COUNTRIES = "FR"

# Un Durable Object « GameRoom » par salon. Classe SQLite : seule disponible sur le plan gratuit.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
