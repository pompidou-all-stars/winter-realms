# Lance les tests de simulation à chaque Pull Request vers main.
# Ne publie rien, ne fusionne rien : le résultat s'affiche dans la PR (« Tests de simulation »).
name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Tests de simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de simulation (mécaniques et une partie entre IA par difficulté)
        run: node tests/tout.js --simulation

  navigateur:
    name: Parcours Chromium 3D et 2D
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Playwright et Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/winter-realms-playwright" --no-package-lock playwright@1.57.0
          "$RUNNER_TEMP/winter-realms-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Vérifier la sélection, la partie et le rendu sous charge
        run: NODE_PATH="$RUNNER_TEMP/winter-realms-playwright/node_modules" node --test tests/navigateur/parcours.test.js
