# Régénère les assets 3D dans le cloud (Blender 5.3 en mode script, sans écran ni carte graphique)
# à chaque Pull Request qui touche art/ ou assets/3d/, et vérifie :
#   - que chaque script s'exécute ;
#   - que chaque fichier 3D respecte son budget (art/budgets.json) ;
#   - que le manifeste est à jour (aucun script modifié sans régénération).
# Les images d'aperçu sont jointes au résultat (onglet Actions → ce passage → Artifacts → apercus-3d).
# Ne modifie rien dans le dépôt, ne publie rien, ne fusionne rien.
name: Assets 3D

on:
  pull_request:
    branches: [main]
    paths:
      - 'art/**'
      - 'assets/3d/**'
      - '.github/workflows/assets-3d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    name: Assets 3D
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: art/outils/requirements.txt
      - name: Bibliothèques système nécessaires à Blender
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1 libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 libxfixes3
      - name: Installer Blender (module Python bpy)
        run: pip install -r art/outils/requirements.txt
      - name: Régénérer et vérifier les assets 3D
        run: python art/outils/generer.py --verifier --apercus apercus
      - name: Joindre les images d'aperçu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apercus-3d
          path: apercus/
          if-no-files-found: ignore
